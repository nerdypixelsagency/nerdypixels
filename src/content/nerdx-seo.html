document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ont-size:17px;font-weight:700\">Do I need a subscription?<span style=\"color:#7D2AE8\">+</span></summary><p style=\"padding:0 0 18px;font-size:15px;line-height:1.65;color:#5C586A\">No. You top up credits and spend them on the reports you run. Credits stay valid for 12 months after your last top-up, and any new top-up extends your whole balance. We remind you 60, 30 and 7 days before anything expires.</p></details>\n    <details style=\"border-top:1px solid #ECE9F3;padding:4px 0\"><summary style=\"cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:16px;padding:18px 0;font-size:17px;font-weight:700\">How much does a report cost?<span style=\"color:#7D2AE8\">+</span></summary><p style=\"padding:0 0 18px;font-size:15px;line-height:1.65;color:#5C586A\">Every tool shows its credit cost on the button before it runs. For example, “Analyse · 10 credits”. Bulk tools show a live estimate as you paste keywords or set a crawl limit. See the full price list above.</p></details>\n    <details style=\"border-top:1px solid #ECE9F3;padding:4px 0\"><summary style=\"cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:16px;padding:18px 0;font-size:17px;font-weight:700\">What happens if a report fails?<span style=\"color:#7D2AE8\">+</span></summary><p style=\"padding:0 0 18px;font-size:15px;line-height:1.65;color:#5C586A\">Credits are held when a job starts and settled when it finishes. If a lookup fails or returns fewer results, the unused credits go back to your wallet automatically. You never pay for an error.</p></details>\n    <details style=\"border-top:1px solid #ECE9F3;padding:4px 0\"><summary style=\"cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:16px;padding:18px 0;font-size:17px;font-weight:700\">Which AI models can I use?<span style=\"color:#7D2AE8\">+</span></summary><p style=\"padding:0 0 18px;font-size:15px;line-height:1.65;color:#5C586A\">NerdX picks the right model for each task and includes it in the credit price. Teams with their own Claude or OpenAI key can connect it.</p></details>\n    <details style=\"border-top:1px solid #ECE9F3;padding:4px 0\"><summary style=\"cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:16px;padding:18px 0;font-size:17px;font-weight:700\">Where does the data come from?<span style=\"color:#7D2AE8\">+</span></summary><p style=\"padding:0 0 18px;font-size:15px;line-height:1.65;color:#5C586A\">Live Google and Bing data from DataForSEO, and speed data from Google PageSpeed Insights. Popular reports may come from recent data; the data date is always shown, and Refresh now pulls it live.</p></details>\n    <details style=\"border-top:1px solid #ECE9F3;padding:4px 0\"><summary style=\"cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:16px;padding:18px 0;font-size:17px;font-weight:700\">Can I pay in dollars?<span style=\"color:#7D2AE8\">+</span></summary><p style=\"padding:0 0 18px;font-size:15px;line-height:1.65;color:#5C586A\">Yes. Naira packs are for Nigeria. Dollar packs are for Ghana, Kenya, South Africa, the UK, the US, the UAE, India and anywhere else. Pay by card, transfer or USSD through Paystack.</p></details>\n    <details style=\"border-top:1px solid #ECE9F3;padding:4px 0\"><summary style=\"cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:16px;padding:18px 0;font-size:17px;font-weight:700\">Do you charge for team members?<span style=\"color:#7D2AE8\">+</span></summary><p style=\"padding:0 0 18px;font-size:15px;line-height:1.65;color:#5C586A\">Never. Invite as many teammates as you like to one wallet and set spending caps per member or per client.</p></details>\n    <details style=\"border-top:1px solid #ECE9F3;border-bottom:1px solid #ECE9F3;padding:4px 0\"><summary style=\"cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:16px;padding:18px 0;font-size:17px;font-weight:700\">Can I try it before paying?<sp dius:50%;background:radial-gradient(circle,rgba(125,42,232,.6),rgba(125,42,232,0) 70%);pointer-events:none\"></div>\n    <div style=\"position:absolute;left:-100px;bottom:-120px;width:320px;height:320px;border-radius:50%;background:radial-gradient(circle,rgba(37,211,102,.35),rgba(37,211,102,0) 70%);pointer-events:none\"></div>\n    <h2 style=\"position:relative;font-size:clamp(28px,3.4vw,40px);line-height:1.1;font-weight:800;letter-spacing:-.035em;max-width:16ch\">Everything you need to rank, in one place</h2>\n    <div style=\"position:relative;display:flex;flex-direction:column;gap:14px;font-size:15px;font-weight:600\">\n      <span style=\"display:flex;gap:12px;align-items:center\"><span style=\"width:26px;height:26px;border-radius:50%;background:#25D366;color:#063D1D;display:grid;place-items:center;font-size:12px;font-weight:800;flex:none\">✓</span>Keyword research for 8 markets</span>\n      <span style=\"display:flex;gap:12px;align-items:center\"><span style=\"width:26px;height:26px;border-radius:50%;background:#25D366;color:#063D1D;display:grid;place-items:center;font-size:12px;font-weight:800;flex:none\">✓</span>Site audits ranked by impact</span>\n      <span style=\"display:flex;gap:12px;align-items:center\"><span style=\"width:26px;height:26px;border-radius:50%;background:#25D366;color:#063D1D;display:grid;place-items:center;font-size:12px;font-weight:800;flex:none\">✓</span>AI included — no API keys needed</span>\n      <span style=\"display:flex;gap:12px;align-items:center\"><span style=\"width:26px;height:26px;border-radius:50%;background:#25D366;color:#063D1D;display:grid;place-items:center;font-size:12px;font-weight:800;flex:none\">✓</span>100 free credits, then top up from ₦5,000</span>\n    </div>\n  </div>\n</div>\n</sc-if>\n</x-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;startView&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;landing&quot;,&quot;auth&quot;],&quot;default&quot;:&quot;landing&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;currency&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;ngn&quot;,&quot;usd&quot;],&quot;default&quot;:&quot;ngn&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;appUrl&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;NerdX SEO App.html&quot;,&quot;tsType&quot;:&quot;string&quot;}}\">\nclass Component extends DCLogic {\n  state = { cur: null, view: null, mode: 'signup', pendingQuery: '', error: '', cat: 'All', more: false, post: null, subscribed: false };\n\n  static POSTS = [\n    { id: 1, cat: 'Guides', title: 'Keyword research for Nigerian businesses: a step-by-step guide', excerpt: 'How to find what your customers actually type into Google, and which keywords are worth the fight.', read: '9 min read', date: 'Oct 14, 2026', coverWord: 'Keyword research', cover: '#7D2AE8', coverInk: '#fff', featured: true,\n      body: ['Start with the problems your customers have, not the products you sell. Write down ten questions they ask you every week, then run each through Keyword Overview to see real monthly volume for your market.', 'Next, filter by difficulty. Anything under 30 is realistic for a newer site. Group the keywords that share an intent and plan one page per group rather than one page per keyword.', 'Finally, check the live SERP. If the top results are guides, write a guide. If they are product pages, a blog post will struggle — build a landing page instead.'] },\n    { id: 2, cat: 'Technical SEO', title: 'Fix these 5 site audit errors first', excerpt: 'Not every warning matters. These are the issues that cost the most rankings, ranked by impact.', read: '6 min read', date: 'Oct 7, 2026', coverWord: 'Site audit', cover: '#1DAA61', coverInk: '#fff',\n      body: ['Broken pages, duplicate titles and oversized images account for most of the ranking damage we see in audits.', 'Run a Site Audit, sort by impact, and fix from the top. A handful of template fixes often clears thousands of warnings at once.'] },\n    { id: 3, cat: 'AI search', title: 'How to get your site cited in AI overviews', excerpt: 'What Google’s AI answers look for, and how to structure pages so they quote you.', read: '7 min read', date: 'Sep 30, 2026', coverWord: 'AI overviews', cover: '#1A0B33', coverInk: '#C9A6FF',\n      body: ['AI overviews favour pages that answer the question in the first two sentences, use clear headings and back claims with specifics.', 'Use the SERP Checker to see who is cited today, then run Content Audit on your page to score how quotable it is.'] },\n    { id: 4, cat: 'Content', title: 'From keyword to published post in one afternoon', excerpt: 'A walkthrough of Content Studio: research, outline, write, optimise and publish to WordPress.', read: '5 min read', date: 'Sep 22, 2026', coverWord: 'Content Studio', cover: '#F3ECFF', coverInk: '#5715B0',\n      body: ['Content Studio pulls the pages that already rank and builds an outline that covers what they cover — plus the gaps.', 'Write with a live SEO score beside you, then export straight to WordPress or copy clean HTML.'] },\n    { id: 5, cat: 'Technical SEO', title: 'Core Web Vitals in plain English', excerpt: 'LCP, INP and CLS explained without jargon — and the quickest wins for slow African mobile networks.', read: '8 min read', date: 'Sep 15, 2026', coverWord: 'Web Vitals', cover: '#E8FBF0', coverInk: '#0B6B3A',\n      body: ['LCP measures how fast the main content appears. INP measures how quickly the page responds to taps. CLS measures how much the layout jumps.', 'On mobile networks, compressing hero images and deferring third-party scripts are usually the fastest wins.'] },\n    { id: 6, cat: 'Guides', title: 'Spy on competitors with Domain Overview', excerpt: 'Find the keywords driving your rivals’ traffic and the gaps you can win this quarter.', read: '6 min read', date: 'Sep 8, 2026', coverWord: 'Competitors', cover: '#A04CF0', coverInk: '#fff',\n      body: ['Enter a competitor’s domain to see its authority, estimated traffic and top keywords.', 'Look for keywords where they rank 4–20 — those are the positions you can realistically take.'] },\n    { id: 7, cat: 'Product updates', title: 'New: Google + Bing side by side', excerpt: 'Compare volumes and rankings across both engines in every research tool.', read: '3 min read', date: 'Sep 1, 2026', coverWord: 'Google + Bing', cover: '#25D366', coverInk: '#063D1D',\n      body: ['Switch the engine toggle in the top bar to Google + Bing and every research tool shows both engines together.'] },\n  ];\n\n  pricingVals() {\n    const cur = this.state.cur || this.props.currency || 'ngn';\n    const ngn = cur === 'ngn';\n    const on = { bg: '#fff', fg: '#14111F', sh: '0 1px 3px rgba(20,17,31,.1)' }, off = { bg: 'transparent', fg: '#5C586A', sh: 'none' };\n    const packsN = [['Starter','₦5,000','500','','₦10.00'],['Growth','₦20,000','2,200','+10% bonus','₦9.09'],['Pro','₦50,000','6,000','+20% bonus','₦8.33'],['Agency','₦150,000','19,500','+30% bonus','₦7.69']];\n    const packsU = [['Starter','$10','1,000','','$0.0100'],['Growth','$30','3,300','+10% bonus','$0.0091'],['Pro','$75','9,000','+20% bonus','$0.0083'],['Agency','$200','26,000','+30% bonus','$0.0077']];\n    const packs = (ngn ? packsN : packsU).map(([name, price, credits, bonus, per]) => {\n      const best = name === 'Agency';\n      return { name, price, credits, bonus, per, badge: best ? 'Best value' : '', bd: best ? '#7D2AE8' : '#ECE9F3', bg: best ? '#FBFAFE' : '#fff', btnBg: best ? '#7D2AE8' : '#F3ECFF', btnFg: best ? '#fff' : '#5715B0' };\n    });\n    const rows = [['SERP & position check','1 keyword, 1 engine',2],['SERP check, Google + Bing','1 keyword',4],['Keyword Overview','1 keyword',10],['Keyword Ideas','up to 100 ideas',10],['Bulk Volume & KD','100 keywords',15],['Domain Overview','1 domain',25],['AI overview citation check','1 keyword',30],['Site Audit','100 pages',20],['Site Audit, JavaScript sites','100 pages',60],['Content Audit','1 article or URL',15],['Content Studio article','research → publish',150],['White-label PDF report','1 report',20],['Core Web Vitals','1 URL',0]];\n    const fmt = c => c === 0 ? 'Free' : ngn ? '₦' + (c * 10).toLocaleString('en-US') : '$' + (c * 0.01).toFixed(2);\n    return {\n      curNgn: ngn ? on : off, curUsd: ngn ? off : on,\n      setNgn: () => this.setState({ cur: 'ngn' }), setUsd: () => this.setState({ cur: 'usd' }),\n      packs,\n      priceRows: rows.map(([tool, unit, c]) => ({ tool, unit, credits: c === 0 ? '0' : String(c), price: fmt(c), cColor: c === 0 ? '#1DAA61' : '#7D2AE8' })),\n      rateNote: ngn ? 'Priced at the Starter rate of ₦10 per credit. Bigger packs cost less per credit.' : 'Priced at the Starter rate of $0.01 per credit. Bigger packs cost less per credit.',\n    };\n  }\n\n  go(view, mode) {\n    this.setState({ view, mode: mode || this.state.mode, error: '' });\n    window.scrollTo({ top: 0 });\n  }\n\n  renderVals() {\n    const view = this.state.view || this.props.startView || 'landing';\n    const isSignup = this.state.mode === 'signup';\n    const on = { bg: '#fff', fg: '#14111F', sh: '0 1px 3px rgba(20,17,31,.1)' };\n    const off = { bg: 'transparent', fg: '#5C586A', sh: 'none' };\n    const appUrl = this.props.appUrl || 'NerdX SEO App.html';\n    const catColors = { Guides: '#7D2AE8', 'Technical SEO': '#1DAA61', 'AI search': '#5715B0', Content: '#A04CF0', 'Product updates': '#0B6B3A' };\n    const deco = p => ({ ...p, catColor: catColors[p.cat] || '#7D2AE8', open: e => { e.preventDefault(); this.setState({ post: p.id }); } });\n    const all = Component.POSTS.map(deco);\n    const cat = this.state.cat;\n    const filtered = all.filter(p => cat === 'All' || p.cat === cat);\n    const feat = cat === 'All' ? filtered.find(p => p.featured) : null;\n    const rest = filtered.filter(p => p !== feat);\n    const limit = this.state.more ? rest.length : 3;\n    const cats = ['All', 'Guides', 'Technical SEO', 'AI search', 'Content', 'Product updates'];\n    const op = all.find(p => p.id === this.state.post) || null;\n    return {\n      blogCats: cats.map(c => ({ label: c, bg: c === cat ? '#14111F' : '#fff', fg: c === cat ? '#fff' : '#3D3A48', bd: c === cat ? '#14111F' : '#E2DEEC', pick: () => this.setState({ cat: c, more: false }) })),\n      featured: feat,\n      posts: rest.slice(0, limit),\n      hasMore: rest.length > limit,\n      showMore: () => this.setState({ more: true }),\n      openPost: op,\n      closePost: () => this.setState({ post: null }),\n      stop: e => e.stopPropagation(),\n      subscribeNote: this.state.subscribed ? 'Thanks — you’re on the list.' : 'No spam. Unsubscribe any time.',\n      onSubscribe: e => { e.preventDefault(); e.target.reset(); this.setState({ subscribed: true }); },\n      isLanding: view === 'landing',\n      isAuth: view === 'auth',\n      isSignup,\n      tabSignup: isSignup ? on : off,\n      tabLogin: isSignup ? off : on,\n      authTitle: isSignup ? 'Create your free account' : 'Welcome back',\n      authSub: isSignup ? 'Get 100 free credits — enough for about ten keyword overviews. Nothing renews.' : 'Log in to pick up where you left off.',\n      authCta: isSignup ? 'Create account · get 100 credits' : 'Log in',\n      ...this.pricingVals(),\n      openApp: () => { if(window.__nxWaitlist){window.__nxWaitlist();return;} window.location.href = appUrl; },\n      pendingQuery: this.state.pendingQuery,\n      error: this.state.error,\n      toLanding: () => this.go('landing'),\n      toSignup: () => { this.setState({ post: null }); this.go('auth', 'signup'); },\n      toLogin: () => this.go('auth', 'login'),\n      onHeroSearch: e => {\n        e.preventDefault();\n        const q = e.target.q.value.trim();\n        this.setState({ pendingQuery: q });\n        this.go('auth', 'signup');\n      },\n      onAuth: e => {\n        e.preventDefault();\n        const f = e.target;\n        const email = f.email.value.trim();\n        if (f.pass
